<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD Groco | Abu Dhabi's Largest Online Supermarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-card { border-radius: 12px; overflow: hidden; transition: 0.3s; background: white; border: 1px solid #f1f1f1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .cart-badge { position: absolute; top: -5px; right: -10px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; }
        .category-pill { cursor: pointer; padding: 10px 20px; border-radius: 20px; white-space: nowrap; font-weight: bold; transition: 0.2s; border: 1px solid #e5e7eb; }
        .active-pill { background: #166534; color: white; border-color: #166534; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Sticky Header -->
    <header class="bg-green-800 text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div onclick="location.reload()" class="cursor-pointer">
                <h1 class="text-xl font-black">AD GROCO</h1>
                <p class="text-[9px] uppercase tracking-widest opacity-80">Abu Dhabi Hypermarket</p>
            </div>
            <div class="relative cursor-pointer" onclick="openCart()">
                <i class="fas fa-shopping-cart text-2xl"></i>
                <span id="cart-count" class="cart-badge">0</span>
            </div>
        </div>
        <!-- Search Bar -->
        <div class="container mx-auto px-4 pb-3">
            <div class="relative">
                <input type="text" id="search-input" onkeyup="searchProduct()" placeholder="Search 1000+ products (Rice, Milk, Soap...)" class="w-full p-3 rounded-lg text-black outline-none shadow-inner">
                <i class="fas fa-search absolute right-4 top-4 text-gray-400"></i>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white border-b sticky top-[110px] z-40 shadow-sm overflow-x-auto">
        <div class="container mx-auto px-4 py-3 flex space-x-3">
            <div onclick="filterCat('All')" id="p-All" class="category-pill active-pill">All</div>
            <div onclick="filterCat('Grocery')" id="p-Grocery" class="category-pill">Grocery</div>
            <div onclick="filterCat('Fresh')" id="p-Fresh" class="category-pill">Fresh Food</div>
            <div onclick="filterCat('Personal')" id="p-Personal" class="category-pill">Personal Care</div>
            <div onclick="filterCat('Beverage')" id="p-Beverage" class="category-pill">Beverages</div>
        </div>
    </nav>

    <!-- Product Grid -->
    <main class="container mx-auto px-4 py-6">
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </main>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal">
        <div class="bg-white w-full max-w-md m-4 rounded-2xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
            <h2 class="text-2xl font-bold mb-4 border-b pb-2">Your Shopping Cart</h2>
            <div id="cart-items" class="flex-grow overflow-y-auto space-y-4 mb-6"></div>
            <div class="border-t pt-4">
                <div class="flex justify-between text-xl font-black mb-6">
                    <span>Total:</span>
                    <span id="cart-total">0.00 AED</span>
                </div>
                <input type="text" id="cust-name" placeholder="Full Name" class="w-full p-3 border rounded-lg mb-3">
                <button onclick="sendWhatsAppOrder()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-700">
                    Confirm Order via WhatsApp
                </button>
                <button onclick="closeModals()" class="w-full mt-3 text-gray-400 text-sm">Continue Shopping</button>
            </div>
        </div>
    </div>

    <!-- Staff Login (Admin) -->
    <div id="admin-modal" class="modal">
        <div class="bg-white w-full max-w-lg rounded-2xl p-6 max-h-[90vh] flex flex-col">
            <h2 class="text-xl font-bold mb-4">Price Manager</h2>
            <div id="admin-list" class="flex-grow overflow-y-auto space-y-2 pr-2"></div>
            <button onclick="closeModals()" class="mt-4 bg-black text-white py-3 rounded-lg">Close</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-12 px-4 mt-12 text-center">
        <h2 class="font-bold text-lg">AD GROCO HYPERMARKET</h2>
        <p class="text-slate-400 text-sm mt-2">Serving Abu Dhabi 24/7 | Fast Home Delivery</p>
        <p class="text-slate-500 text-xs mt-6">WhatsApp: +971 55 385 5150</p>
        <button onclick="openAdmin()" class="mt-10 text-slate-700 text-[10px] font-bold tracking-widest uppercase">Staff Login</button>
    </footer>

    <script>
        let products = [
            { id: 1, cat: "Grocery", name: "Tilda Pure Basmati Rice 5kg", price: 48.50, img: "https://m.media-amazon.com/images/I/71Y6G7x7m+L._AC_SL1500_.jpg" },
            { id: 2, cat: "Grocery", name: "Alokozay Sunflower Oil 1.5L", price: 16.00, img: "https://m.media-amazon.com/images/I/51IuU7G6b+L._AC_.jpg" },
            { id: 3, cat: "Fresh", name: "Almarai Fresh Milk 2L", price: 11.00, img: "https://m.media-amazon.com/images/I/618x+O37n1L._AC_SL1500_.jpg" },
            { id: 4, cat: "Beverage", name: "Lipton Yellow Label 100 Bags", price: 14.50, img: "https://m.media-amazon.com/images/I/71XmCPr4YTL._AC_SL1500_.jpg" },
            { id: 5, cat: "Personal", name: "Dove Beauty Bar 4x125g", price: 19.00, img: "https://m.media-amazon.com/images/I/71FstC06DGL._AC_SL1500_.jpg" },
            { id: 6, cat: "Personal", name: "Head & Shoulders 400ml", price: 21.50, img: "https://m.media-amazon.com/images/I/61SOnG-9T+L._AC_SL1500_.jpg" },
            { id: 7, cat: "Fresh", name: "Fresh Banana (Philippines) 1kg", price: 5.75, img: "https://m.media-amazon.com/images/I/51ebZJ+DR4L._AC_.jpg" },
            { id: 8, cat: "Grocery", name: "Nutella Hazelnut Spread 400g", price: 18.50, img: "https://m.media-amazon.com/images/I/71XmCPr4YTL._AC_SL1500_.jpg" },
            { id: 9, cat: "Beverage", name: "Nescafe Classic 200g Jar", price: 26.00, img: "https://m.media-amazon.com/images/I/61S1iS6O+KL._AC_SL1500_.jpg" },
            { id: 10, cat: "Grocery", name: "Maggi Noodles 5x77g", price: 7.50, img: "https://m.media-amazon.com/images/I/81B-87oGZAL._AC_SL1500_.jpg" },
            { id: 11, cat: "Fresh", name: "Local Chicken Fresh 1kg", price: 17.00, img: "https://m.media-amazon.com/images/I/61hZAnx6PcL._AC_.jpg" },
            { id: 12, cat: "Personal", name: "Colgate Herbal Toothpaste 125ml", price: 9.25, img: "https://m.media-amazon.com/images/I/71T7Z3rR1WL._AC_SL1500_.jpg" },
            { id: 13, cat: "Fresh", name: "Fresh Eggs (30 Pcs Pack)", price: 15.50, img: "https://m.media-amazon.com/images/I/61hZAnx6PcL._AC_.jpg" },
            { id: 14, cat: "Beverage", name: "Coca-Cola 1.25L Bottle", price: 5.50, img: "https://m.media-amazon.com/images/I/51vSy90nAnL._AC_SL1000_.jpg" },
            { id: 15, cat: "Personal", name: "Dettol Soap 4x120g", price: 16.50, img: "https://m.media-amazon.com/images/I/61I49m6H+SL._AC_SL1000_.jpg" },
            { id: 16, cat: "Grocery", name: "Sugar Fine 2kg Pack", price: 8.00, img: "https://m.media-amazon.com/images/I/61+D6G4O7tL._AC_SL1000_.jpg" },
            { id: 17, cat: "Fresh", name: "Fresh Tomatoes 1kg", price: 4.50, img: "https://m.media-amazon.com/images/I/31lS5p-m1DL._AC_.jpg" },
            { id: 18, cat: "Fresh", name: "Onion Red 1kg Bag", price: 3.50, img: "https://m.media-amazon.com/images/I/41-qf3P5f6L._AC_.jpg" },
            { id: 19, cat: "Grocery", name: "Barilla Spaghetti 500g", price: 6.75, img: "https://m.media-amazon.com/images/I/71XmCPr4YTL._AC_SL1500_.jpg" },
            { id: 20, cat: "Personal", name: "Pampers Size 4 (50 Pcs)", price: 55.00, img: "https://m.media-amazon.com/images/I/71XmCPr4YTL._AC_SL1500_.jpg" }
        ];

        let cart = [];
        let currentCat = "All";

        function render() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const filtered = currentCat === "All" ? products : products.filter(p => p.cat === currentCat);
            
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card p-3 shadow-sm">
                        <div class="h-32 flex items-center justify-center mb-2">
                            <img src="${p.img}" class="max-h-full max-w-full object-contain">
                        </div>
                        <h3 class="text-[11px] font-bold text-gray-700 h-8 overflow-hidden">${p.name}</h3>
                        <p class="text-green-700 font-black mt-2">${p.price.toFixed(2)} AED</p>
                        <button onclick="addToCart(${p.id})" class="mt-3 bg-orange-500 text-white w-full py-2 rounded-lg text-xs font-bold hover:bg-orange-600">ADD TO CART</button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            cart.push(p);
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCart() {
            const list = document.getElementById('cart-items');
            list.innerHTML = '';
            let total = 0;
            
            if(cart.length === 0) { list.innerHTML = '<p class="text-center text-gray-400">Cart is empty</p>'; }
            
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-sm font-bold">${item.name}</span>
                        <div class="flex items-center">
                            <span class="text-sm font-bold mr-4">${item.price.toFixed(2)}</span>
                            <button onclick="removeFromCart(${index})" class="text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total.toFixed(2) + ' AED';
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCart();
        }

        function filterCat(c) {
            document.querySelectorAll('.category-pill').forEach(el => el.classList.remove('active-pill'));
            document.getElementById('p-' + c).classList.add('active-pill');
            currentCat = c;
            render();
        }

        function searchProduct() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card p-3">
                        <div class="h-32 flex items-center justify-center mb-2">
                            <img src="${p.img}" class="max-h-full max-w-full object-contain">
                        </div>
                        <h3 class="text-[11px] font-bold text-gray-700 h-8 overflow-hidden">${p.name}</h3>
                        <p class="text-green-700 font-black mt-2">${p.price.toFixed(2)} AED</p>
                        <button onclick="addToCart(${p.id})" class="mt-3 bg-orange-500 text-white w-full py-2 rounded-lg text-xs font-bold">ADD TO CART</button>
                    </div>
                `;
            });
        }

        function sendWhatsAppOrder() {
            const name = document.getElementById('cust-name').value;
            if(!name || cart.length === 0) { alert("Please enter name and add items."); return; }
            
            let itemsText = cart.map(i => `- ${i.name} (${i.price.toFixed(2)} AED)`).join('\n');
            let total = cart.reduce((sum, i) => sum + i.price, 0).toFixed(2);
            
            const msg = `🛒 NEW ORDER: AD GROCO\n------------------\nCustomer: ${name}\n\nItems:\n${itemsText}\n\nTOTAL: ${total} AED\n------------------\nDelivery Location: Abu Dhabi`;
            window.open(`https://wa.me/971553855150?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function openAdmin() {
            if(prompt("Staff Password:") === "amir2026") {
                const list = document.getElementById('admin-list');
                list.innerHTML = '';
                products.forEach(p => {
                    list.innerHTML += `<div class="flex justify-between items-center p-2 border-b">
                        <span class="text-[10px] w-2/3">${p.name}</span>
                        <input type="number" step="0.01" value="${p.price}" onchange="updatePrice(${p.id}, this.value)" class="w-20 p-1 border rounded text-right font-bold text-blue-600">
                    </div>`;
                });
                document.getElementById('admin-modal').style.display = 'flex';
            }
        }

        function updatePrice(id, val) {
            products.find(x => x.id === id).price = parseFloat(val);
            render();
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        render();
    </script>
</body>
</html>
