<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD Groco - Best Online Grocery in Abu Dhabi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card { border: 1px solid #ddd; border-radius: 12px; padding: 15px; text-align: center; transition: 0.3s; }
        .product-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #admin-panel, #order-form { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; box-shadow: 0 0 25px rgba(0,0,0,0.4); z-index: 100; border-radius: 15px; width: 90%; max-width: 400px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="overlay" class="overlay" onclick="closeAll()"></div>

    <!-- Header -->
    <header class="bg-green-700 text-white p-5 text-center sticky top-0 z-50 shadow-md">
        <h1 class="text-3xl font-extrabold tracking-tight">AD Groco</h1>
        <p class="text-sm opacity-90">আবুধাবিতে দ্রুততম গ্রোসারি ডেলিভারি</p>
    </header>

    <!-- WhatsApp Support Floating Button -->
    <a href="https://wa.me/971553855150" class="fixed bottom-5 right-5 bg-green-500 text-white p-4 rounded-full shadow-2xl z-50">
        💬 Chat
    </a>

    <!-- Main Content -->
    <div class="container mx-auto p-4">
        <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <!-- Products will be generated by JS -->
        </div>
    </div>

    <!-- Order Form -->
    <div id="order-form">
        <h2 class="font-bold text-xl mb-4 text-green-700 border-b pb-2">অর্ডার কনফার্ম করুন</h2>
        <p id="selected-item-name" class="mb-4 text-gray-700 font-medium"></p>
        <input type="text" id="cust-name" placeholder="আপনার নাম লিখুন" class="w-full p-3 border rounded-lg mb-3 focus:outline-green-500">
        <input type="tel" id="cust-phone" placeholder="মোবাইল নম্বর" class="w-full p-3 border rounded-lg mb-4 focus:outline-green-500">
        <button onclick="sendToWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 w-full rounded-lg transition">হোয়াটসঅ্যাপে অর্ডার পাঠান</button>
        <button onclick="closeAll()" class="mt-4 text-red-500 w-full text-center text-sm">বাতিল করুন</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <h2 class="font-bold text-lg mb-4 text-blue-700">অ্যাডমিন প্যানেল (Tanvir)</h2>
        <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড দিন" class="w-full p-3 border rounded-lg mb-3">
        <div id="price-controls" style="display:none;" class="max-h-60 overflow-y-auto">
            <p class="text-sm font-bold mb-3">পণ্যের দাম আপডেট করুন (AED):</p>
            <div id="admin-items"></div>
        </div>
        <button id="login-btn" onclick="adminLogin()" class="bg-blue-600 text-white py-2 w-full rounded">লগইন</button>
        <button onclick="closeAll()" class="mt-4 text-gray-500 w-full text-center text-sm">বন্ধ করুন</button>
    </div>

    <div class="text-center my-10">
        <button onclick="showAdminLogin()" class="text-gray-400 text-xs hover:underline">Admin Login</button>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white p-8 text-center mt-10">
        <p class="font-bold text-lg">AD Groco Abu Dhabi</p>
        <p class="text-gray-400 mt-2">যোগাযোগ: +971553855150</p>
        <p class="text-gray-400">ইমেইল: tanvirrahmanamir@gmail.com</p>
        <div class="mt-4 text-xs text-gray-500">
            &copy; 2026 Tanvir Rahman. All rights reserved.
        </div>
    </footer>

    <script>
        // প্রোডাক্ট লিস্ট এবং দাম
        let products = [
            { id: 1, name: "Basmati Rice 5kg", price: 35.00, img: "https://cdn-icons-png.flaticon.com/512/5029/5029236.png" },
            { id: 2, name: "Cooking Oil 1.5L", price: 18.50, img: "https://cdn-icons-png.flaticon.com/512/3058/3058995.png" },
            { id: 3, name: "Fresh Onion 1kg", price: 3.25, img: "https://cdn-icons-png.flaticon.com/512/723/723651.png" },
            { id: 4, name: "Farm Eggs 30pcs", price: 15.00, img: "https://cdn-icons-png.flaticon.com/512/837/837160.png" },
            { id: 5, name: "Fresh Tomato 1kg", price: 4.50, img: "https://cdn-icons-png.flaticon.com/512/1202/1202125.png" }
        ];

        let selectedProduct = null;
        const myWhatsApp = "971553855150";

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="product-card bg-white shadow-sm">
                        <img src="${p.img}" class="w-20 h-20 mx-auto mb-3 object-contain">
                        <h3 class="font-bold text-gray-800">${p.name}</h3>
                        <p class="text-green-600 font-extrabold text-lg my-1">${p.price.toFixed(2)} AED</p>
                        <button onclick="openOrderForm(${p.id})" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-full mt-3 text-sm font-bold w-full transition">অর্ডার করুন</button>
                    </div>
                `;
            });
        }

        function openOrderForm(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('selected-item-name').innerText = "পণ্য: " + selectedProduct.name;
            document.getElementById('order-form').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function sendToWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;

            if(!name || !phone) {
                alert("দয়া করে আপনার নাম এবং মোবাইল নম্বর দিন।");
                return;
            }

            // হোয়াটসঅ্যাপ মেসেজ ফরম্যাট
            const message = `নতুন অর্ডার (AD Groco):\n----------------------\nপণ্য: ${selectedProduct.name}\nদাম: ${selectedProduct.price} AED\n\nকাস্টমারের তথ্য:\nনাম: ${name}\nফোন: ${phone}\n----------------------\nআবুধাবি ডেলিভারি সার্ভিস।`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${myWhatsApp}?text=${encodedMessage}`;
            
            // নতুন ট্যাবে হোয়াটসঅ্যাপ ওপেন হবে
            window.open(whatsappURL, '_blank');
            closeAll();
        }

        function closeAll() {
            document.getElementById('order-form').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // অ্যাডমিন ফাংশন
        function showAdminLogin() {
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function adminLogin() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === "amir2026") { 
                document.getElementById('price-controls').style.display = 'block';
                document.getElementById('admin-pass').style.display = 'none';
                document.getElementById('login-btn').style.display = 'none';
                loadAdminItems();
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function loadAdminItems() {
            const container = document.getElementById('admin-items');
            container.innerHTML = '';
            products.forEach(p => {
                container.innerHTML += `
                    <div class="flex justify-between items-center mb-3 bg-gray-50 p-2 rounded">
                        <span class="text-xs font-medium">${p.name}</span>
                        <input type="number" step="0.01" value="${p.price}" onchange="updatePrice(${p.id}, this.value)" class="w-20 border rounded p-1 text-center font-bold text-blue-600">
                    </div>
                `;
            });
        }

        function updatePrice(id, val) {
            const product = products.find(p => p.id === id);
            product.price = parseFloat(val);
            renderProducts(); 
        }

        renderProducts();
    </script>
</body>
</html>
